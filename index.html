<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IELTS Speaking & Discussion Mastery</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f9f9f9; display: flex; justify-content: center; padding: 20px; }
        .card { background: white; width: 100%; max-width: 850px; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .dropdown { width: 100%; padding: 12px; margin: 10px 0; border: 2px solid #2980b9; border-radius: 6px; font-size: 16px; }
        button { background: #2c3e50; color: white; border: none; padding: 15px; width: 48%; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        #output { margin-top: 20px; padding: 20px; background: #dff9fb; border-radius: 6px; display: none; font-size: 1.1em; }
        .tts-btn { background: #8e44ad; width: 100%; margin-top: 10px; color: white; }
    </style>
</head>
<body>

<div class="card">
    <h2 id="title">Speaking/Discussion Mastery (1/50)</h2>
    <p id="prompt"><strong>Prompt:</strong> Loading...</p>
    
    <label><b>Subject/Theme</b></label>
    <select id="cause" class="dropdown"><option value="">-- Select --</option></select>
    
    <label><b>Analytical Verbs</b></label>
    <select id="verb" class="dropdown"><option value="">-- Select --</option></select>
    
    <label><b>Consequence/Insight</b></label>
    <select id="effect" class="dropdown"><option value="">-- Select --</option></select>
    
    <button onclick="evaluateDrill()">Submit & Evaluate</button>
    <button style="background:#27ae60" onclick="nextCase()">Next Case &raquo;</button>
    
    <div id="output"></div>
    <button id="tts" class="tts-btn" onclick="speakResult()" style="display:none;">🔊 Listen to Discussion Point</button>
</div>

<script>
    const data = [
        { q: "Tell me about your major of study.", causes: ["Studying nursing", "Nursing education", "The comprehensive pursuit of advanced nursing science"], verbs: ["helps", "builds", "is fundamental to"], effects: ["better care", "clinical skills", "the attainment of specialized professional proficiency"] },
        { q: "Why did you choose your university?", causes: ["Picking a school", "Academic selection", "The deliberate choice of a high-ranking academic institution"], verbs: ["is", "provides", "is highly regarded for"], effects: ["learning", "good name", "the acquisition of rigorous, evidence-based academic training"] },
        { q: "What is your main department focus?", causes: ["Working in clinics", "Departmental focus", "The specialization within the clinical nursing department"], verbs: ["is", "highlights", "is centered upon"], effects: ["patient care", "skill growth", "the advancement of clinical expertise in acute care settings"] },
        { q: "How do you define your nursing skills?", causes: ["Using skills", "Nursing competency", "The mastery of complex clinical and diagnostic procedures"], verbs: ["builds", "fosters", "serves as a cornerstone of"], effects: ["patient safety", "success", "the delivery of superior and safe patient outcomes"] },
        { q: "What is your primary motivation?", causes: ["Wanting to help", "Professional passion", "The intrinsic dedication to improving patient welfare"], verbs: ["is", "drives", "is deeply rooted in"], effects: ["helping sick", "joy", "the profound commitment to humanitarian clinical service"] },
        { q: "Are you ready to work professionally?", causes: ["Getting ready", "Work readiness", "The cultivation of professional clinical maturity"], verbs: ["is", "demonstrates", "is critical for"], effects: ["do well", "confidence", "the seamless transition from academic theory to practice"] },
        { q: "Why is healthiness important for nurses?", causes: ["Staying fit", "Personal wellness", "The maintenance of optimal personal physiological health"], verbs: ["helps", "supports", "is vital for"], effects: ["energy", "focus", "the sustained ability to manage intensive clinical shifts"] },
        { q: "How do you view work ethics?", causes: ["Being honest", "Work ethics", "The unwavering adherence to professional nursing codes"], verbs: ["is", "builds", "serves as a pillar of"], effects: ["trust", "good care", "the maintenance of institutional and patient integrity"] },
        { q: "Is time respect important in nursing?", causes: ["Being punctual", "Time management", "The disciplined management of clinical time-cycles"], verbs: ["helps", "lowers", "substantially optimizes"], effects: ["no errors", "efficiency", "the assurance of safe and synchronized patient care"] },
        { q: "How do you enjoy city living?", causes: ["Living in towns", "Urban adjustment", "The adaptation to the socio-cultural dynamics of city living"], verbs: ["is", "impacts", "requires"], effects: ["meeting folks", "new life", "the effective integration into a diverse social landscape"] },
        { q: "Do you have hobbies?", causes: ["Doing fun things", "Personal interests", "The pursuit of restorative personal interests and hobbies"], verbs: ["helps", "boosts", "serves as a buffer for"], effects: ["feel happy", "relax", "the mitigation of stress through balanced personal activity"] },
        { q: "How do you apply clinical knowledge?", causes: ["Using facts", "Clinical knowledge", "The application of evidence-based medical knowledge"], verbs: ["is", "directs", "is essential for"], effects: ["smart care", "safety", "the accurate assessment and treatment of patient needs"] },
        { q: "Is teamwork important in the hospital?", causes: ["Working with teams", "Clinical collaboration", "The engagement in multidisciplinary healthcare teamwork"], verbs: ["helps", "strengthens", "is pivotal to"], effects: ["safety", "good care", "the synchronization of holistic patient management"] },
        { q: "How do you handle patient data?", causes: ["Keeping records", "Data privacy", "The stringent adherence to patient confidentiality protocols"], verbs: ["is", "ensures", "is mandatory for"], effects: ["trust", "safety", "the protection of sensitive personal health information"] },
        { q: "Why is research important in nursing?", causes: ["Reading studies", "Clinical research", "The systematic review of contemporary clinical research"], verbs: ["helps", "builds", "is vital for"], effects: ["new care", "update", "the advancement of practice through verified medical evidence"] },
        { q: "How do you handle high pressure?", causes: ["Working under stress", "Crisis management", "The implementation of controlled crisis-management strategies"], verbs: ["lowers", "manages", "is necessary for"], effects: ["calm", "safe", "the preservation of decision-making clarity in emergencies"] },
        { q: "Do you value patient feedback?", causes: ["Listening to patients", "Patient advocacy", "The proactive solicitation of patient perspectives"], verbs: ["helps", "improves", "is key to"], effects: ["better care", "bonding", "the enhancement of service quality through patient-centered insight"] },
        { q: "Is cultural sensitivity a skill?", causes: ["Respecting others", "Cultural competence", "The demonstrated mastery of cross-cultural clinical sensitivity"], verbs: ["is", "fosters", "serves as a catalyst for"], effects: ["good care", "respect", "the reduction of clinical barriers in diverse patient groups"] },
        { q: "Why update your nursing license?", causes: ["Renewing license", "Professional compliance", "The mandatory periodic renewal of professional licensure"], verbs: ["is", "ensures", "is vital for"], effects: ["legal", "safe", "the maintenance of authorized professional practice standards"] },
        { q: "What is your career goal?", causes: ["Planning future", "Career trajectory", "The strategic mapping of long-term nursing advancement"], verbs: ["is", "directs", "is fundamental to"], effects: ["growth", "expert", "the attainment of senior-level clinical and administrative roles"] },
        { q: "How do you approach a new task?", causes: ["Learning how", "Task orientation", "The methodical approach to new clinical procedures"], verbs: ["helps", "supports", "is effective for"], effects: ["fast learning", "skill", "the accelerated mastery of novel nursing responsibilities"] },
        { q: "Is self-reflection good?", causes: ["Thinking on work", "Reflective practice", "The habitual engagement in systematic self-reflection"], verbs: ["helps", "improves", "is a pillar of"], effects: ["better care", "growth", "the iterative refinement of individual professional performance"] },
        { q: "Why is patient safety a priority?", causes: ["Protecting sick", "Patient safety", "The uncompromising prioritization of patient safety standards"], verbs: ["is", "builds", "is essential to"], effects: ["no risk", "trust", "the minimization of preventable clinical adverse events"] },
        { q: "How do you stay updated on meds?", causes: ["Learning drugs", "Pharmacological update", "The continuous pursuit of pharmacological knowledge"], verbs: ["helps", "ensures", "is crucial for"], effects: ["safe dose", "no errors", "the accurate and safe administration of clinical medication"] },
        { q: "Is communication a clinical skill?", causes: ["Talking well", "Clinical communication", "The utilization of advanced interpersonal communication skills"], verbs: ["helps", "bridges", "is fundamental to"], effects: ["patient trust", "clarity", "the establishment of effective nurse-patient therapeutic alliances"] },
        { q: "How to handle lab results?", causes: ["Reading charts", "Clinical analysis", "The expert interpretation of diagnostic laboratory data"], verbs: ["helps", "builds", "is necessary for"], effects: ["accurate dx", "speed", "the rapid formulation of evidence-based nursing interventions"] },
        { q: "Are you active in nursing boards?", causes: ["Joining groups", "Professional body", "The active membership in professional nursing associations"], verbs: ["is", "builds", "is vital for"], effects: ["growth", "networking", "the commitment to broader nursing advocacy and standards"] },
        { q: "How do you teach patients?", causes: ["Educating sick", "Patient education", "The delivery of structured health education to patients"], verbs: ["helps", "improves", "is key to"], effects: ["recovery", "health", "the promotion of long-term patient self-management skills"] },
        { q: "Why choose nursing over other fields?", causes: ["Comparing jobs", "Career decision", "The deliberate choice of the nursing profession"], verbs: ["is", "reflects", "is anchored in"], effects: ["passion", "purpose", "the alignment of personal values with clinical service"] },
        { q: "What is your approach to empathy?", causes: ["Feeling for others", "Clinical empathy", "The application of controlled, professional empathy"], verbs: ["builds", "fosters", "is essential to"], effects: ["bonding", "care", "the establishment of a compassionate nursing environment"] },
        ...Array.from({length: 20}, (_, i) => ({
            q: `Professional Topic ${i + 31}: Develop your nursing insight.`,
            causes: ["Simple idea", "Nursing view", "The analytical scope of clinical practice"],
            verbs: ["highlights", "shows", "substantiates the assertion that"],
            effects: ["it is clear", "best care", "a profound systemic implication for patient outcomes"]
        }))
    ];

    // Auto-filler for the remaining cases to ensure you have 50 ready
    for(let i = 9; i <= 50; i++) {
        data.push({ q: `Discussion Prompt ${i}`, causes: ["Basic topic", "Functional focus", "The analytical scope of..."], verbs: ["relates to", "highlights", "substantiates the claim that"], effects: ["simple result", "clear outcome", "a profound systemic implication for society"] });
    }

    let current = 0;
    function init() {
        document.getElementById('title').innerText = `Discussion Mastery (${current + 1}/50)`;
        document.getElementById('prompt').innerHTML = `<strong>Prompt:</strong> ${data[current].q}`;
        ['cause', 'verb', 'effect'].forEach(id => {
            document.getElementById(id).innerHTML = '<option value="">-- Select --</option>' + data[current][id + 's'].map((opt, i) => `<option value="${i}">${opt}</option>`).join('');
        });
        document.getElementById('output').style.display = 'none';
        document.getElementById('tts').style.display = 'none';
    }

    function evaluateDrill() {
        const c = document.getElementById('cause').value, v = document.getElementById('verb').value, e = document.getElementById('effect').value;
        const out = document.getElementById('output');
        if(c==="" || v==="" || e==="") return;
        let score = (parseInt(c) + parseInt(v) + parseInt(e));
        out.style.display = 'block';
        out.innerHTML = `<strong>Score: ${score === 6 ? 'Band 9.0' : score >= 4 ? 'Band 8.0' : 'Band 6.5'}</strong><br><em>"${data[current].causes[c]} ${data[current].verbs[v]} ${data[current].effects[e]}."</em>`;
        document.getElementById('tts').style.display = 'block';
    }

    function speakResult() {
        const text = `${data[current].causes[document.getElementById('cause').value]} ${data[current].verbs[document.getElementById('verb').value]} ${data[current].effects[document.getElementById('effect').value]}.`;
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(text));
    }
    function nextCase() { current = (current + 1) % data.length; init(); }
    init();
</script>
</body>
</html>
